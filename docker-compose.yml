services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: madad
      POSTGRES_PASSWORD: madad
      POSTGRES_DB: madad
    volumes:
      - madad_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madad"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://madad:madad@db:5432/madad
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@madad.pk}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-admin12345}
    depends_on:
      db:
        condition: service_healthy

volumes:
  madad_pgdata:
